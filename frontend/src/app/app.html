<div class="container">
  <h1 class="header">System Obiegu Dokumentów</h1>
  
  <div class="form-card">
    <h2>Dodaj nowy dokument</h2>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Tytuł dokumentu:</label>
        <input type="text" [(ngModel)]="newDocument.title" name="title" required>
      </div>
      
      <div class="form-group">
        <label>Treść:</label>
        <textarea [(ngModel)]="newDocument.content" name="content" required rows="4"></textarea>
      </div>
      
      <button type="submit" class="btn-submit">Wgraj do systemu</button>
    </form>
  </div>

  <h2 class="list-title">Ostatnie dokumenty</h2>
  
  @if (documents.length === 0) {
    <p class="empty-state">Brak dokumentów w bazie danych.</p>
  }

  @for (doc of documents; track doc.id) {
    <div class="document-card">
      <div class="card-header">
        <h3>{{ doc.title }}</h3>
        
        <div class="actions">
          <span class="status-badge">Status: {{ doc.status }}</span>
          <button (click)="onDelete(doc.id)" class="btn-delete">Usuń</button>
        </div>
      </div>
      
      <p class="content">{{ doc.content }}</p>
      <small class="meta">ID w bazie: {{ doc.id }}</small>
    </div>
  }
</div>
